name: Générer sounds.json

on:
  push:
    paths:
      - 'sounds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scanner les sons et les transcriptions
        run: |
          python3 - <<'PY'
          import os, json
          exts = ('.mp3', '.ogg', '.wav')
          data, tr = {}, {}
          for cat in sorted(os.listdir('sounds')):
              path = os.path.join('sounds', cat)
              if not os.path.isdir(path):
                  continue
              files = sorted(f for f in os.listdir(path) if f.lower().endswith(exts))
              if files:
                  data[cat] = files
              for f in files:
                  txt = os.path.join(path, os.path.splitext(f)[0] + '.txt')
                  if os.path.exists(txt):
                      tr[cat + '/' + f] = open(txt, encoding='utf-8').read().strip()
          json.dump(data, open('sounds/sounds.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          json.dump(tr, open('sounds/transcripts.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds/sounds.json sounds/transcripts.json
          git diff --staged --quiet || (git commit -m "chore: mise à jour de sounds.json et transcripts.json" && git push)
