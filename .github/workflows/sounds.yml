name: Générer sounds.json et transcriptions

on:
  push:
    paths:
      - 'sounds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Installer Whisper
        run: pip install faster-whisper

      - name: Scanner les sons et transcrire
        run: |
          python3 - <<'PY'
          import os, json
          exts = ('.mp3', '.ogg', '.wav')
          try:
              old = json.load(open('sounds/transcripts.json', encoding='utf-8'))
          except Exception:
              old = {}
          model = None
          data, tr = {}, {}
          for cat in sorted(os.listdir('sounds')):
              p = os.path.join('sounds', cat)
              if not os.path.isdir(p):
                  continue
              files = sorted(f for f in os.listdir(p) if f.lower().endswith(exts))
              if files:
                  data[cat] = files
              for f in files:
                  key = cat + '/' + f
                  txt = os.path.join(p, os.path.splitext(f)[0] + '.txt')
                  if os.path.exists(txt):
                      tr[key] = open(txt, encoding='utf-8').read().strip()
                  elif key in old:
                      tr[key] = old[key]
                  else:
                      if model is None:
                          from faster_whisper import WhisperModel
                          model = WhisperModel('small', device='cpu', compute_type='int8')
                      segs, _ = model.transcribe(os.path.join(p, f), language='fr', vad_filter=True)
                      tr[key] = ' '.join(s.text.strip() for s in segs).strip()
          json.dump(data, open('sounds/sounds.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          json.dump(tr, open('sounds/transcripts.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds/sounds.json sounds/transcripts.json
          git diff --staged --quiet || (git commit -m "chore: mise à jour de sounds.json et transcripts.json" && git push)
